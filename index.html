<title>Pacha Restobar</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: black stage with a faint rotating sunburst (from the logo); home = two big colour buttons, inside = sticky category chips + price list rows. */
:root {
  --bg: #060606;
  --surface: #131313;
  --line: #2b2b2b;
  --fg: #f4f2ee;
  --muted: #aaa7a0;
  --pink: #ff2d8a;
  --teal: #19c7b0;
  --amber: #ffb020;
  --accent: var(--pink);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

/* ---------- Home ---------- */
.home { position: relative; overflow: hidden; padding-block: 40px 56px; }
.sun {
  position: absolute;
  left: 50%;
  top: 150px;
  width: 920px;
  max-width: none;
  height: 920px;
  margin-left: -460px;
  margin-top: -460px;
  opacity: 0.07;
  pointer-events: none;
  animation: spin 160s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding-bottom: 36px; }
.logo { width: 160px; height: 160px; border-radius: 50%; display: block; }
.hero p { color: var(--muted); max-width: 30ch; }
.choices { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.choice {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 28px;
  min-height: 220px;
  padding: 22px 20px;
  border-radius: 10px;
  text-decoration: none;
  color: #050505;
  transition: transform 0.15s ease;
}
.choice:hover { transform: translateY(-3px); }
.choice.comida { background: var(--pink); }
.choice.bebestibles { background: var(--teal); }
.choice b { font-family: var(--display); font-weight: 700; font-size: clamp(1.3rem, 5.5vw, 1.9rem); line-height: 1.1; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.choice span { font-size: 0.95rem; font-weight: 500; line-height: 1.35; }
.choice i { font-style: normal; font-family: var(--display); font-size: 1.5rem; }
.foot { position: relative; margin-top: 36px; text-align: center; color: var(--muted); font-size: 0.85rem; }

/* ---------- Menu views ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 0.9rem; padding: 6px 0; }
.back:hover { color: var(--fg); }
.view-title { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: 700 0.9rem var(--body);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #050505; }

.menu { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 44px; }
.cat { display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 130px; }
.cat > h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.3rem, 5vw, 1.7rem);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 12px;
}
.cat > h2::before { content: ""; width: 14px; height: 14px; background: var(--accent); flex: 0 0 auto; transform: rotate(45deg); }
.cat-note { color: var(--muted); font-size: 0.9rem; margin-top: -12px; }
.group { display: flex; flex-direction: column; }
.group > h3 { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.group > .gnote { color: var(--muted); font-size: 0.88rem; margin-top: 2px; }
.items { margin-top: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.price { font-family: var(--display); font-weight: 500; font-size: 0.95rem; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; grid-column: 2; grid-row: 1; align-self: start; }
.desc { grid-column: 1; color: var(--muted); font-size: 0.92rem; }
.plain { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
.plain li { list-style: none; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-weight: 500; }
.plain { margin: 0; padding-left: 0; }

.item.has-thumb { grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 2px 14px; }
.item.has-thumb .price { grid-column: auto; grid-row: auto; align-self: center; }
.item .price.na { font-family: var(--body); font-weight: 500; font-size: 0.8rem; color: var(--muted); }
.thumb { width: 54px; height: 54px; background: var(--surface); border-radius: 10px; padding: 5px; display: block; }
.info { display: flex; flex-direction: column; min-width: 0; }

@media (max-width: 520px) {
  .choices { grid-template-columns: 1fr; }
  .choice { min-height: 170px; }
}
@media (prefers-reduced-motion: reduce) {
  .sun { animation: none; }
  .choice { transition: none; }
}
</style>
</head>

  var ST = 'stroke="#d7d4cc" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"';

      if (extra === "salt") g = '<line x1="14" y1="7" x2="34" y2="7" stroke="#fff" stroke-width="3" stroke-dasharray="1.5 2.5"/>';

  function look(name, grp) {
    var s = name.toLowerCase();
    var g = (grp || "").toLowerCase();
    if (g.indexOf("schop") >= 0 || g.indexOf("pitcher") >= 0) {
      var beer = /cristal/.test(s) ? "#f0c64a" : /toro/.test(s) ? "#c9731c" : /austral/.test(s) ? "#8a3a1a" : /kunstmann/.test(s) ? "#d49a2a" : "#e3a82c";
      return G.mug(beer);
    }
    if (/michelada/.test(s)) return G.high("#d4452a", "salt");
    if (/0°/.test(s)) return G.bottle("#cfe3d0");
    if (/kunstmann bock/.test(s)) return G.bottle("#5a2a12");
    if (/torobayo/.test(s)) return G.bottle("#c9731c");
    if (/kunstmann lager/.test(s)) return G.bottle("#e3b341");
    if (/austral/.test(s)) return G.bottle("#8a3a1a");
    if (/royal guard/.test(s)) return G.bottle("#d9a83a");
    if (/heineken/.test(s)) return G.bottle("#2f7a3a");
    if (/pisco sour menta/.test(s)) return G.coupe("#cfe3a0");
    if (/pisco sour/.test(s)) return G.coupe("#e8e0a0");
    if (/mango sour/.test(s)) return G.coupe("#ffb830");
    if (/whisky sour/.test(s)) return G.coupe("#e3a64a");
    if (/amaretto/.test(s)) return G.coupe("#c4793a");
    if (/cosmopolitan/.test(s)) return G.coupe("#ff4d6d");
    if (/margarita blue/.test(s)) return G.coupe("#2aa8ff", true);
    if (/margarita sabores/.test(s)) return G.coupe("#ff5e7e", true);
    if (/margarita/.test(s)) return G.coupe("#cde58a", true);
    if (/sunrise/.test(s)) return G.high("#ff7a1a", "straw");
    if (/mojito 0/.test(s)) return G.high("#bfe8c4", "mint");
    if (/mojito/.test(s)) return G.high("#d3f1cf", "mint");
    if (/caipir/.test(s)) return G.rocks("#cfe88a");
    if (/collins/.test(s)) return G.high("#f3e58a", "lime");
    if (/moscow/.test(s)) return G.high("#e9d9a0", "lime");
    if (/ramazzotti spritz/.test(s)) return G.wine("#b8402a");
    if (/spritz/.test(s)) return G.wine("#ff8a3d");
    if (/tropical/.test(s)) return G.high("#7fd6e8", "straw");
    if (/piña colada/.test(s)) return G.hurricane("#f7efc2");
    if (/daiquiri/.test(s)) return G.hurricane("#ff6b8a");
    if (/ruso blanco/.test(s)) return G.rocks("#efe3cf");
    if (/ruso negro/.test(s)) return G.rocks("#3a2418");
    if (/espumante|kit royal/.test(s)) return G.flute("#f3e6a8");
    if (/pulpa/.test(s)) return G.fruit();
    if (/alto|mistral/.test(s)) return G.rocks("#dfe9ee");
    if (/jack daniel/.test(s)) return G.rocks("#b46a1a");
    if (/whisky|johnnie|ballantine|grant/.test(s)) return G.rocks("#c8801f");
    if (/fernet/.test(s)) return G.rocks("#2a1a12");
    if (/olmeca/.test(s)) return G.shot("#e8c36a");
    if (/jagger/.test(s)) return G.shot("#2f1f14");
    if (/jack fire/.test(s)) return G.shot("#b3341c");
    if (/red bull/.test(s)) return G.can("#3b6fb6");
    if (/jugo/.test(s)) return G.high("#ffa63a", "straw");
    if (/limonada sabor/.test(s)) return G.high("#ff7aa0", "straw");
    if (/limonada/.test(s)) return G.high("#f0e56a", "lime");
    if (/bebida/.test(s)) return G.high("#6b2f1a", "straw");
    return G.high("#cccccc");
  }

  function itemHtml(it, gname) {
    var hasPrice = it.p != null;
    if (thumbs) {
      var pr = hasPrice ? '<span class="price">' + esc(typeof it.p === "number" ? money(it.p) : it.p) + '</span>' : '<span class="price na">Consultar</span>';
      return '<div class="item has-thumb">' + look(it.n, gname) + '<div class="info"><span class="name">' + esc(it.n) + '</span>' + (it.d ? '<span class="desc">' + esc(it.d) + '</span>' : "") + '</div>' + pr + '</div>';
    }
    var price = hasPrice ? '<span class="price">' + esc(typeof it.p === "number" ? money(it.p) : it.p) + '</span>' : "";
    return '<div class="item"><span class="name">' + esc(it.n) + '</span>' + price + (it.d ? '<span class="desc">' + esc(it.d) + '</span>' : "") + '</div>';
  }

  function groupHtml(g) {
    var priced = g.items.some(function (it) { return it.p != null; });
    var head = (g.name ? '<h3>' + esc(g.name) + '</h3>' : "") + (g.note && g.note.indexOf("carta del local") < 0 ? '<p class="gnote">' + esc(g.note) + '</p>' : "");
    var body = (priced || thumbs)
      ? '<div class="items">' + g.items.map(function (it) { return itemHtml(it, g.name); }).join("") + '</div>'
      : '<ul class="plain">' + g.items.map(function (it) { return '<li>' + esc(it.n) + '</li>'; }).join("") + '</ul>';
    return '<div class="group">' + head + body + '</div>';
  }

  function catHtml(c) {
    return '<section class="cat" id="cat-' + c.id + '"><h2>' + esc(c.title) + '</h2>' +
      (c.note && c.note.indexOf("carta del local") < 0 ? '<p class="cat-note">' + esc(c.note) + '</p>' : "") +
      c.groups.map(groupHtml).join("") + '</section>';
  }

  function view(key) {
    var v = DATA[key];
    thumbs = key === "bebestibles";
    var chips = '<button class="chip" type="button" data-cat="todo" aria-pressed="' + (active === "todo") + '">Todo</button>' +
      v.cats.map(function (c) { return '<button class="chip" type="button" data-cat="' + c.id + '" aria-pressed="' + (active === c.id) + '">' + esc(c.title) + '</button>'; }).join("");
    var shown = v.cats.filter(function (c) { return active === "todo" || active === c.id; });
    return '<div style="--accent:' + v.accent + '">' +
      '<header class="bar"><div class="wrap">' +
        '<div class="bar-top"><a class="back" href="#">← Inicio</a><span class="view-title">' + esc(v.title) + '</span></div>' +
        '<div class="chips" role="group" aria-label="Categorías">' + chips + '</div>' +
      '</div></header>' +
      '<main class="wrap menu">' + shown.map(catHtml).join("") + '</main></div>';
  }

  function render() {
    var route = location.hash.replace("#", "");
    if (route !== lastRoute) { active = "todo"; lastRoute = route; window.scrollTo(0, 0); }
    app.innerHTML = DATA[route] ? view(route) : home();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if (!b) return;
    active = b.getAttribute("data-cat");
    render();
    window.scrollTo(0, 0);
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>

</body>
</html>
